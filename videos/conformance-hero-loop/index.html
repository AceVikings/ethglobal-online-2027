<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6f4ef; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f6f4ef; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.52) 28%, rgba(246,244,239,0) 60%),
          radial-gradient(circle at 12% 18%, rgba(15,23,42,0.10), rgba(15,23,42,0) 30%),
          radial-gradient(circle at 88% 82%, rgba(38,115,77,0.09), rgba(38,115,77,0) 32%);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.28;
        background-image: radial-gradient(rgba(15,23,42,0.18) 0.65px, transparent 0.65px);
        background-size: 9px 9px;
      }
      .field { position: absolute; inset: 0; }
      .route { fill: none; stroke: rgba(15,23,42,0.20); stroke-width: 2; stroke-linecap: round; }
      .route.accent { stroke: rgba(38,115,77,0.44); }
      .node { position: absolute; width: 18px; height: 18px; border: 2px solid rgba(15,23,42,0.52); border-radius: 9999px; background: #f6f4ef; }
      .node::after { content: ""; position: absolute; inset: 5px; border-radius: 9999px; background: #0f172a; }
      .signal { fill: #0f172a; opacity: 0; }
      .signal.accent { fill: #26734d; }
      .verdict-stage { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px 0 0 -165px; }
      .verdict-glow { position: absolute; inset: -110px; border-radius: 9999px; background: radial-gradient(circle, rgba(38,115,77,0.22), rgba(38,115,77,0) 66%); opacity: 0; }
      .verdict-ring { position: absolute; inset: 0; border-radius: 9999px; border: 1px solid rgba(15,23,42,0.20); background: rgba(255,255,255,0.62); backdrop-filter: blur(12px); }
      .verdict-ring::before { content: ""; position: absolute; inset: 24px; border: 1px solid rgba(15,23,42,0.12); border-radius: 9999px; }
      .seal-svg { position: absolute; inset: 70px; width: 190px; height: 190px; overflow: visible; }
      .seal-circle, .seal-check { fill: none; stroke: #0f172a; stroke-linecap: round; stroke-linejoin: round; }
      .seal-circle { stroke-width: 3; opacity: 0.28; }
      .seal-check { stroke: #26734d; stroke-width: 11; }
      .halo { position: absolute; border: 1px solid rgba(15,23,42,0.12); border-radius: 9999px; opacity: 0; }
      .halo.one { inset: -72px; }
      .halo.two { inset: -136px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <section id="proof-field" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="wash"></div>
        <div class="grain"></div>
        <svg class="field" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <path id="route-a" class="route" d="M 110 180 C 390 180, 545 315, 795 475" />
          <path id="route-b" class="route accent" d="M 70 790 C 360 790, 550 690, 795 590" />
          <path id="route-c" class="route" d="M 1810 160 C 1500 160, 1370 320, 1125 475" />
          <path id="route-d" class="route" d="M 1840 845 C 1510 845, 1360 700, 1125 590" />
          <path id="route-e" class="route" d="M 250 1010 C 570 940, 700 820, 860 690" />
          <path id="route-f" class="route accent" d="M 1690 1015 C 1390 935, 1240 820, 1060 690" />
          <circle id="signal-a" class="signal" r="7" cx="110" cy="180" />
          <circle id="signal-b" class="signal accent" r="7" cx="70" cy="790" />
          <circle id="signal-c" class="signal" r="7" cx="1810" cy="160" />
          <circle id="signal-d" class="signal" r="7" cx="1840" cy="845" />
          <circle id="signal-e" class="signal" r="7" cx="250" cy="1010" />
          <circle id="signal-f" class="signal accent" r="7" cx="1690" cy="1015" />
        </svg>
        <div class="node" style="left:101px;top:171px"></div>
        <div class="node" style="left:61px;top:781px"></div>
        <div class="node" style="left:1801px;top:151px"></div>
        <div class="node" style="left:1831px;top:836px"></div>
        <div class="node" style="left:241px;top:1001px"></div>
        <div class="node" style="left:1681px;top:1006px"></div>
        <div class="verdict-stage" id="verdict-stage">
          <div class="verdict-glow" id="verdict-glow"></div>
          <div class="halo one"></div>
          <div class="halo two" data-layout-allow-overflow></div>
          <div class="verdict-ring"></div>
          <svg class="seal-svg" viewBox="0 0 190 190" xmlns="http://www.w3.org/2000/svg">
            <circle id="seal-circle" class="seal-circle" cx="95" cy="95" r="82" />
            <path id="seal-check" class="seal-check" d="M 52 98 L 82 126 L 140 65" />
          </svg>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const routes = Array.from(document.querySelectorAll(".route"));
      const signals = [
        document.querySelector("#signal-a"),
        document.querySelector("#signal-b"),
        document.querySelector("#signal-c"),
        document.querySelector("#signal-d"),
        document.querySelector("#signal-e"),
        document.querySelector("#signal-f"),
      ];
      const routePoints = [];
      routes.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
        routePoints.push(Array.from({ length: 121 }, (_, index) => path.getPointAtLength(length * index / 120)));
      });

      const circleLength = document.querySelector("#seal-circle").getTotalLength();
      const checkLength = document.querySelector("#seal-check").getTotalLength();
      gsap.set("#seal-circle", { strokeDasharray: circleLength, strokeDashoffset: circleLength });
      gsap.set("#seal-check", { strokeDasharray: checkLength, strokeDashoffset: checkLength });
      gsap.set("#verdict-stage", { scale: 0.94, opacity: 0 });
      gsap.set(".node", { opacity: 0 });
      gsap.set(".wash, .grain", { opacity: 0 });

      tl.to(".wash", { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
      tl.to(".grain", { opacity: 0.28, duration: 0.8, ease: "power1.out" }, 0);
      tl.to(".node", { opacity: 1, duration: 0.5, stagger: 0.08, ease: "power1.out" }, 0.35);
      routes.forEach((path, index) => {
        tl.to(path, { strokeDashoffset: 0, duration: 1.45, ease: "power2.out" }, 0.6 + index * 0.07);
      });
      tl.to("#verdict-stage", { scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" }, 1.65);
      tl.to("#verdict-glow", { opacity: 0.28, scale: 1, duration: 0.9, ease: "power2.out" }, 1.85);

      routes.forEach((path, index) => {
        const signal = signals[index];
        const points = routePoints[index];
        tl.to(signal, {
          opacity: 1,
          duration: 0.08,
          ease: "none",
        }, 1.55 + index * 0.08);
        tl.to(signal, {
          duration: 1.25,
          ease: "power2.inOut",
          onUpdate: function () {
            const point = points[Math.round(this.progress() * 120)];
            signal.setAttribute("cx", point.x);
            signal.setAttribute("cy", point.y);
          },
        }, 1.62 + index * 0.08);
        tl.to(signal, { opacity: 0, duration: 0.18 }, 2.72 + index * 0.08);
      });

      tl.to("#seal-circle", { strokeDashoffset: 0, duration: 1.15, ease: "power2.out" }, 2.45);
      tl.to("#seal-check", { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 3.2);
      tl.to(".halo.one", { opacity: 0.34, scale: 1.05, duration: 1.0, ease: "power2.out" }, 3.3);
      tl.to(".halo.two", { opacity: 0.22, scale: 1.04, duration: 1.2, ease: "power2.out" }, 3.46);

      const phase = { p: 0 };
      const stage = document.querySelector("#verdict-stage");
      tl.to(phase, {
        p: Math.PI * 2,
        duration: 2.2,
        ease: "none",
        onUpdate: () => {
          const offset = Math.sin(phase.p) * 2;
          stage.style.transform = `translateY(${offset}px) scale(1)`;
        },
      }, 4.05);

      tl.to("#proof-field > *", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 6.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
