name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      - run: forge test --root contracts

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, node, solidity]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Build immutable image
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$image" .
          docker push "$image"

      - name: Deploy revision
        run: >-
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE"
          --quiet
          --project "$GCP_PROJECT_ID"
          --region "$GCP_REGION"
          --image "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/api:$GITHUB_SHA"
          --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT"
          --execution-environment gen2
          --cpu 1
          --memory 1Gi
          --concurrency 1
          --min 0
          --max-instances 1
          --timeout 600
          --port 8080
          --set-env-vars "^|^HOST=0.0.0.0|CARETAKER_STATE_FILE=/data/caretaker-state.json|LIVE_RUN_ROOT=/data/live-runs|LIVE_CLEARANCE_ENABLED=true|LIVE_MAX_RUNS_PER_DAY=3|LIVE_RUN_COOLDOWN_SECONDS=30|GRAPH_GATEWAY_BASE=https://gateway.thegraph.com/api/deployments/id|GRAPH_MCP_URL=https://subgraphs.mcp.thegraph.com/sse|X402_FACILITATOR_URL=https://api.testnet.blocky402.com|X402_NETWORK=hedera:testnet|X402_SCHEME=${{ vars.X402_SCHEME }}|X402_PRICE_USDC=0.01|X402_PAY_TO=${{ vars.X402_PAY_TO }}|X402_FEE_PAYER=${{ vars.X402_FEE_PAYER }}|HTS_USDC_ID=${{ vars.HTS_USDC_ID }}|HEDERA_JSON_RPC=${{ vars.HEDERA_JSON_RPC }}|HEDERA_OPERATOR_ID=${{ vars.HEDERA_OPERATOR_ID }}|HEDERA_SELLER_ID=${{ vars.HEDERA_SELLER_ID }}|PRIVY_APP_ID=${{ vars.PRIVY_APP_ID }}|PRIVY_HEDERA_ACCOUNT_ID=${{ vars.PRIVY_HEDERA_ACCOUNT_ID }}|ATS_FACTORY_ID=${{ vars.ATS_FACTORY_ID }}|ATS_RESOLVER_ID=${{ vars.ATS_RESOLVER_ID }}|ATS_SECURITY_ID=${{ vars.ATS_SECURITY_ID }}|ATS_SECURITY_EVM_ADDRESS=${{ vars.ATS_SECURITY_EVM_ADDRESS }}|ATS_PARTITION=${{ vars.ATS_PARTITION }}|SELLER_EVM_ADDRESS=${{ vars.SELLER_EVM_ADDRESS }}|BUYER_EVM_ADDRESS=${{ vars.BUYER_EVM_ADDRESS }}|CLEARING_ESCROW_ADDRESS=${{ vars.CLEARING_ESCROW_ADDRESS }}|POLICY_HASH=${{ vars.POLICY_HASH }}|CONFORMANCE_EXPECTED_SIGNER=${{ vars.CONFORMANCE_EXPECTED_SIGNER }}|HCS_TOPIC_ID=${{ vars.HCS_TOPIC_ID }}|EQUITY_NAME=Spokane Private Credit Fund|EQUITY_SYMBOL=SPCF|CORS_ALLOWED_ORIGIN=${{ vars.CORS_ALLOWED_ORIGIN }}"
          --set-secrets "GRAPH_STUDIO_KEY=graph-studio-key:latest,VERDICT_SIGNER_KEY=verdict-signer-key:latest,PRIVY_APP_SECRET=privy-app-secret:latest,PRIVY_WALLET_ID=privy-wallet-id:latest,HEDERA_OPERATOR_KEY=hedera-operator-key:latest,HEDERA_SELLER_KEY=hedera-seller-key:latest"
          --add-volume "name=state,type=cloud-storage,bucket=$GCP_STATE_BUCKET"
          --add-volume-mount "volume=state,mount-path=/data"

      - name: Smoke test deployed revision
        run: |
          service_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$service_url/health"
