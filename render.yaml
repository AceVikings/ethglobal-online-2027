services:
  - type: web
    name: conformance-desk
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build --workspace @conformance-desk/web
    staticPublishPath: packages/web/dist
    envVars:
      - key: VITE_PRIVY_APP_ID
        value: cmtyhw5k700fo0cia82y7o5pg
    routes:
      - type: rewrite
        source: /api/*
        destination: https://conformance-desk-api-4p35sr23vq-uc.a.run.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
